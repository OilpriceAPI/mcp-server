# Isolated App Platform app. APP_URL binds its stable HTTPS ingress.
# Reviewed source 61d1aa61d64030d22237806af72c97d05e40da36, immutable DOCR image.
# Do not apply this spec to either existing API/frontend app.
name: oilpriceapi-openai-mcp
region: nyc
services:
  - name: energy-mcp
    image:
      registry_type: DOCR
      registry: opa-2025-registry
      repository: oilpriceapi-openai-mcp
      digest: sha256:eb043360d1ee8db2791e84d6112da8dc7538429928d7cea9472450bc35d3f313
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: OILPRICEAPI_MCP_PUBLIC_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
