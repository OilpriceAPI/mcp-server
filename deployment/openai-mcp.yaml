# Isolated App Platform app. APP_URL binds its stable HTTPS ingress.
# Reviewed source 46d54cf79d5d85b6804d10b78fc88490c7b76a4c, immutable DOCR image.
# Do not apply this spec to either existing API/frontend app.
name: oilpriceapi-openai-mcp
region: nyc
services:
  - name: energy-mcp
    image:
      registry_type: DOCR
      registry: opa-2025-registry
      repository: oilpriceapi-openai-mcp
      digest: sha256:f612c1e64bd81ae06f0a7d8e3518e3325e529e84e87cdc8444655e23db97d3f2
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: OILPRICEAPI_MCP_PUBLIC_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
