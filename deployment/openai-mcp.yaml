# Isolated App Platform app. APP_URL binds its stable HTTPS ingress.
# Reviewed source 6a59fbdffc88bdc4a347f81799fb56b006cbf462 (#150), immutable DOCR image.
# Rollback: previous digest sha256:02b58d701a7f4cd74def1f8045c6529afb9f0cb616429e57ec78b5e3b000b1e2.
# Do not apply this spec to either existing API/frontend app.
name: oilpriceapi-openai-mcp
region: nyc
services:
  - name: energy-mcp
    image:
      registry_type: DOCR
      registry: opa-2025-registry
      repository: oilpriceapi-openai-mcp
      digest: sha256:a2bc659c691845cead42f14ee7157786a8d69fcc872c8b8d8b4d8a5f1355dc0a
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: OILPRICEAPI_MCP_PUBLIC_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Claude's hosted connector sends Origin: https://claude.ai on /register and /mcp.
      - key: MCP_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: https://claude.ai,https://claude.com
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  # Cloudflare CNAME, DNS-only (not proxied) so platform egress is not challenged.
  - domain: mcp.oilpriceapi.com
    type: PRIMARY
