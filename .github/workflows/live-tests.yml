name: Live API tests

# Runs the live smoke test (scripts/live-smoke.mjs) against the real
# OilPriceAPI to catch path/contract regressions like the v2.2.0 futures 404
# (/v1/futures/latest?contract= — a route that does not exist). The unit
# suite (vitest) mocks fetch, so only this job exercises the real endpoints.
#
# The secret-bearing smoke runs only from the repository's default branch.
# Pull-request and manually dispatched feature-branch code never receive it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run verify:release-metadata
      - run: npm test
      - run: npm run build
      - run: npm run generate:live-contracts
      - run: npm run smoke:live-contract-matrix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-contract-matrix
          path: artifacts/live-contract-matrix.json
          if-no-files-found: error
      - run: npm run smoke:public-claims
      - run: npm run smoke:product-facts
      - run: npm run smoke:package
      - run: npm run smoke:docker
      - run: npm run smoke:registry-verifier
      - run: npm run smoke:npm-verifier
      - run: npm run smoke:release-provenance
      - run: npm pack --dry-run

  runtime-compatibility:
    name: Packed runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm run smoke:product-facts

  public-product-facts:
    name: Public product-facts compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:product-facts:live

  live:
    name: Live API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never expose the production synthetic key to unmerged code.
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - name: Live contract test (complete published tool registry)
        env:
          OILPRICEAPI_TEST_KEY: ${{ secrets.OILPRICEAPI_TEST_KEY }}
          OILPRICEAPI_LIVE_REQUIRED: "1"
          SMOKE_WRITE_CONTRACTS: "1"
        run: npm run test:live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: live-contract-results
          path: artifacts/live-contract-results.json
          if-no-files-found: error
