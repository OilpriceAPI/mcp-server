name: Live API tests

# Runs the live smoke test (scripts/live-smoke.mjs) against the real
# OilPriceAPI to catch path/contract regressions like the v2.2.0 futures 404
# (/v1/futures/latest?contract= — a route that does not exist). The unit
# suite (vitest) mocks fetch, so only this job exercises the real endpoints.
#
# The secret-bearing smoke runs only from the repository's default branch.
# Pull-request and manually dispatched feature-branch code never receive it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Durable OAuth store (#155): the Postgres store test and the remote
    # container smoke run against this throwaway database.
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: mcp_oauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run verify:release-metadata
      - run: npm test
        env:
          MCP_OAUTH_TEST_DATABASE_URL: postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/mcp_oauth_test
      - run: npm run build
      - run: npm run check:readme-tools
      - run: npm run generate:live-contracts
      - run: npm run smoke:live-contract-matrix
      # Identity invariant against the LIVE catalog (#8437). Exits 2 when it
      # cannot check, so a missing secret fails visibly rather than passing.
      - run: npm run smoke:commodity-identity
        if: github.ref == 'refs/heads/main'
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_TEST_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-contract-matrix
          path: artifacts/live-contract-matrix.json
          if-no-files-found: error
      - run: npm run smoke:public-claims
      - run: npm run smoke:product-facts
      - run: npm run smoke:package
      - run: npm run smoke:docker
      - name: Remote MCP container smoke (no account credential)
        run: |
          docker build -f Dockerfile.remote -t opa-openai-plugin:ci .
          # Production fails closed without a durable store and key (#155);
          # host networking reaches the service Postgres on 127.0.0.1.
          docker run --detach --name opa-remote-ci --network host \
            --env PORT=18080 \
            --env OILPRICEAPI_MCP_PUBLIC_URL=https://127.0.0.1:18080 \
            --env OILPRICEAPI_MCP_OAUTH_DATABASE_URL=postgres://postgres:ci-only-not-a-secret@127.0.0.1:5432/mcp_oauth_test \
            --env OILPRICEAPI_MCP_OAUTH_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            opa-openai-plugin:ci
          trap 'docker logs opa-remote-ci 2>&1 | tail -20; docker rm -f opa-remote-ci >/dev/null 2>&1' EXIT
          node scripts/smoke-remote-container.mjs http://127.0.0.1:18080/mcp
          docker logs opa-remote-ci 2>&1 | grep -q '"event":"oauth_store_ready","durable":true'
      - run: npm run smoke:registry-verifier
      - run: npm run smoke:npm-verifier
      - run: npm run smoke:release-provenance
      - run: npm pack --dry-run

  runtime-compatibility:
    name: Packed runtime / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm run smoke:product-facts

  public-product-facts:
    name: Public product-facts compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:product-facts:live

  live:
    name: Live API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never expose the production synthetic key to unmerged code.
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run build
      - name: Live contract test (complete published tool registry)
        env:
          OILPRICEAPI_TEST_KEY: ${{ secrets.OILPRICEAPI_TEST_KEY }}
          OILPRICEAPI_LIVE_REQUIRED: "1"
          SMOKE_WRITE_CONTRACTS: "1"
        run: npm run test:live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: live-contract-results
          path: artifacts/live-contract-results.json
          if-no-files-found: error
