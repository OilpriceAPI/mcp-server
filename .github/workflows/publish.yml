name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Authentication via OIDC Trusted Publishing (configured on npmjs.com for
      # repo OilpriceAPI/mcp-server, workflow publish.yml, no environment).
      # No NODE_AUTH_TOKEN needed; OIDC also satisfies the package 2FA requirement
      # and produces provenance automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public
