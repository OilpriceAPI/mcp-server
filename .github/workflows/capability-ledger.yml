name: Capability ledger

# Checks capability-ledger.json (#77) against the live published OpenAPI
# contract, the registered tools and the REST paths src/index.ts calls.
# The daily run catches a new API operation even when this repository is
# quiet. The check exits nonzero (2) when it cannot reach its sources or its
# route-policy snapshot is stale, so a broken check never reads as a pass.
# The contract URL is public and keyless; no secrets are used.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: API-to-MCP capability ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm run check:capability-ledger
