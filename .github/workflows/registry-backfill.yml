name: MCP registry backfill

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_ARCHIVE: mcp-publisher_linux_amd64.tar.gz
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

# Manual re-publish of server.json to the official MCP registry
# (registry.modelcontextprotocol.io) WITHOUT cutting a release or touching
# npm. Use when the registry has drifted behind npm — e.g. the 2.0.0→2.3.0
# staleness that motivated issue #14. Normal releases publish via publish.yml;
# this exists only for backfill/repair.

on:
  workflow_dispatch:

jobs:
  registry:
    name: Publish to MCP registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Verify dispatch is exact protected main
        env:
          MCP_PROVENANCE_MODE: registry-backfill
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          npm run verify:release-provenance

      - name: Verify release metadata
        run: npm run verify:release-metadata

      - name: Verify version exists on npm (registry must never lead npm)
        run: |
          PKG=$(jq -r .version package.json)
          PUBLISHED=$(timeout 30s npm view "oilpriceapi-mcp@$PKG" version)
          if [ "$PUBLISHED" != "$PKG" ]; then
            echo "::error::npm returned $PUBLISHED instead of $PKG"
            exit 1
          fi

      - name: Install pinned MCP registry publisher
        run: |
          ARCHIVE="$RUNNER_TEMP/$MCP_PUBLISHER_ARCHIVE"
          curl --fail --location --silent --show-error --max-time 60 --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/$MCP_PUBLISHER_ARCHIVE"
          echo "$MCP_PUBLISHER_SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate MCP registry metadata
        run: timeout 2m mcp-publisher validate

      - name: Check whether the public registry already matches
        id: registry_state
        env:
          MCP_REGISTRY_ATTEMPTS: "1"
          MCP_REGISTRY_DELAY_MS: "0"
        run: |
          if npm run verify:mcp-registry-release; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to MCP registry (GitHub OIDC)
        if: steps.registry_state.outputs.current != 'true'
        run: timeout 2m mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.registry_state.outputs.current != 'true'
        run: timeout 5m mcp-publisher publish

      - name: Verify public MCP registry readback
        run: npm run verify:mcp-registry-release
